<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mehulsinh Darbar | Official Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 45px 25px 30px;
      text-align: center;
      background: #151515;
      border-radius: 30px;
      border: 1px solid #252525;
      box-shadow:
        0 0 35px rgba(255, 0, 100, 0.18),
        0 0 80px rgba(255, 0, 100, 0.08);
    }

    .logo {
      width: 145px;
      height: 145px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(
        135deg,
        #ff1493,
        #9b00ff
      );

      font-size: 48px;
      font-weight: bold;

      box-shadow:
        0 0 25px rgba(255, 20, 147, 0.7),
        0 0 55px rgba(155, 0, 255, 0.35);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .username {
      color: #aaa;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .description {
      color: #ddd;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 18px 0;

      border-radius: 40px;
      text-decoration: none;
      color: white;

      font-size: 20px;
      font-weight: bold;

      background: linear-gradient(
        90deg,
        #ff007a,
        #ff2d8b
      );

      box-shadow: 0 8px 25px rgba(255, 0, 120, 0.25);

      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(255, 0, 120, 0.45);
    }

    .footer {
      margin-top: 45px;
      color: #777;
      font-size: 15px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 35px 20px 25px;
      }

      .logo {
        width: 125px;
        height: 125px;
        font-size: 40px;
      }

      h1 {
        font-size: 31px;
      }

      .username {
        font-size: 18px;
      }

      .description {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      MD
    </div>

    <h1>Mehulsinh Darbar</h1>

    <div class="username">
      @mehuldarbar
    </div>

    <div class="description">
      Welcome to my official profile page.<br>
      Explore my social world and connect with me.
    </div>

    <a
      class="btn"
      href="https://www.instagram.com/it_z_mehull/"
      target="_blank"
    >
      📸 Instagram
    </a>

    <a
      class="btn"
      href="https://github.com/mehuldarbar"
      target="_blank"
    >
      💻 GitHub
    </a>

    <div class="footer">
      © 2026 Mehulsinh Darbar
    </div>

  </div>

</body>
</html>
