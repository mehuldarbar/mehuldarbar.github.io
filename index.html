<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mehulsinh Darbar | Official Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      min-height: 650px;
      background: #151515;
      border-radius: 45px;
      padding: 55px 30px 35px;
      text-align: center;

      box-shadow:
        0 0 35px rgba(255, 0, 100, 0.15),
        0 0 80px rgba(255, 0, 100, 0.08);
    }

    /* PROFILE PHOTO */
    .profile-photo {
      width: 190px;
      height: 190px;
      margin: 0 auto 38px;
      border-radius: 50%;
      overflow: hidden;

      border: 4px solid #ff1493;

      box-shadow:
        0 0 20px rgba(255, 20, 147, 0.8),
        0 0 45px rgba(190, 0, 255, 0.35);
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .username {
      color: #aaa;
      font-size: 22px;
      margin-bottom: 42px;
    }

    .bio {
      color: #eee;
      font-size: 21px;
      line-height: 1.8;
      margin: 0 auto 50px;
      max-width: 520px;
    }

    /* BUTTONS */
    .social-button {
      display: block;
      width: 92%;
      margin: 0 auto 22px;
      padding: 20px;
      border-radius: 50px;

      background: linear-gradient(
        90deg,
        #f00070,
        #ff2d91
      );

      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;

      box-shadow:
        0 8px 25px rgba(255, 0, 110, 0.25);

      transition: 0.25s ease;
    }

    .social-button:hover {
      transform: scale(1.03);
      box-shadow:
        0 10px 35px rgba(255, 0, 110, 0.45);
    }

    .social-button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 55px;
      color: #777;
      font-size: 17px;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      body {
        padding: 20px 10px;
      }

      .card {
        min-height: 650px;
        padding: 45px 20px 30px;
        border-radius: 40px;
      }

      .profile-photo {
        width: 175px;
        height: 175px;
        margin-bottom: 32px;
      }

      h1 {
        font-size: 34px;
      }

      .username {
        font-size: 19px;
        margin-bottom: 35px;
      }

      .bio {
        font-size: 18px;
        line-height: 1.7;
        margin-bottom: 40px;
      }

      .social-button {
        width: 95%;
        font-size: 20px;
        padding: 18px;
      }

      .footer {
        font-size: 15px;
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- YOUR PHOTO -->
    <div class="profile-photo">
      <img
        src="IMG_20260710_185314.jpg"
        alt="Mehulsinh Darbar"
      >
    </div>

    <!-- NAME -->
    <h1>Mehulsinh Darbar</h1>

    <!-- USERNAME -->
    <div class="username">
      @mehuldarbar
    </div>

    <!-- BIO -->
    <div class="bio">
      Welcome to my official profile page.<br>
      Explore my social world and connect with me.
    </div>

    <!-- INSTAGRAM -->
    <a
      class="social-button"
      href="https://www.instagram.com/it_z_mehull/"
      target="_blank"
    >
      📸 Instagram
    </a>

    <!-- GITHUB -->
    <a
      class="social-button"
      href="https://github.com/mehuldarbar"
      target="_blank"
    >
      💻 GitHub
    </a>

    <!-- FOOTER -->
    <div class="footer">
      © 2026 Mehulsinh Darbar
    </div>

  </div>

</body>
</html>
