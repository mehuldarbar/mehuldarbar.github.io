<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehulsinh Darbar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  padding:45px 25px;
  text-align:center;
  border-radius:30px;
  background:linear-gradient(145deg,#191919,#0d0d0d);
  box-shadow:0 0 40px rgba(255,35,120,.18);
  animation:appear 1s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.avatar{
  width:110px;
  height:110px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:bold;
  background:linear-gradient(135deg,#ff2878,#8d1cff);
  box-shadow:0 0 30px rgba(255,40,120,.35);
}

h1{
  margin-top:25px;
  font-size:32px;
}

.tag{
  margin-top:10px;
  color:#aaa;
  font-size:16px;
}

.about{
  margin-top:25px;
  color:#ddd;
  line-height:1.7;
}

.buttons{
  margin-top:30px;
}

.btn{
  display:block;
  text-decoration:none;
  color:white;
  padding:16px;
  margin:13px 0;
  border-radius:50px;
  font-weight:bold;
  background:linear-gradient(90deg,#e91e63,#ff3d8d);
  transition:.25s;
}

.btn:hover{
  transform:scale(1.03);
}

.footer{
  margin-top:30px;
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

  <div class="avatar">MD</div>

  <h1>Mehulsinh Darbar</h1>

  <p class="tag">@mehuldarbar</p>

  <p class="about">
    Welcome to my official profile page.
    Explore my social world and connect with me.
  </p>

  <div class="buttons">

    <a class="btn"
       href="https://instagram.com/it_z_mehull"
       target="_blank">
       📸 Instagram
    </a>

    <a class="btn"
       href="https://github.com/mehuldarbar"
       target="_blank">
       💻 GitHub
    </a>

  </div>

  <div class="footer">
    © 2026 Mehulsinh Darbar
  </div>

</div>

</body>
</html>
